name = "family-cook-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# AI 키는 비밀값으로 넣는다. 둘 중 하나만 있어도 된다 (AI_PROVIDER=auto 면 Claude 우선).
#   pnpm --filter @cook/worker exec wrangler secret put ANTHROPIC_API_KEY   # Claude (유료 종량제)
#   pnpm --filter @cook/worker exec wrangler secret put GEMINI_API_KEY      # Gemini (무료 등급, 유튜브 영상 이해에도 쓴다)
#   pnpm --filter @cook/worker exec wrangler secret put YOUTUBE_API_KEY     # 선택: 유튜브 설명란을 더 안정적으로 읽는다 (무료)
# 아래 vars는 배포 시 자신의 값으로 바꾼다 (또는 Cloudflare 대시보드 > Settings > Variables).
# ALLOWED_EMAILS 는 꼭 채운다(설치한 사람 이메일). 비어 있으면 AI 기능이 모두 막힌다 (비용 사고 방지). "*"는 로그인한 누구나.
# 이 사람이 있는 가족에 초대 코드로 들어온 사람은 따로 적지 않아도 쓸 수 있다 (src/guard.ts familyAllowed).
[vars]
FIREBASE_PROJECT_ID = ""
ALLOWED_ORIGINS = "http://localhost:5173"
ALLOWED_EMAILS = ""
DAILY_LIMIT_PER_USER = "40"   # 하루 한 사람 (레시피·추천·링크·바꾸기 1, 웹 검색 레시피·영수증·사진 2, 물어보기·대체 재료 0.5. 이름 정리는 세지 않음)
DAILY_LIMIT_TOTAL = "150"     # 하루 가족 전체
AI_PROVIDER = "auto"
CLAUDE_MODEL = "claude-sonnet-5-5"        # 레시피·사진 가져오기·바꾸기·추천·영수증 (Opus보다 싸고 빠름. 더 꼼꼼히 하려면 claude-opus-5-5)
CLAUDE_FAST_MODEL = "claude-haiku-5-5"     # 이름 정리·물어보기·대체 재료 (빠르고 쌈)
GEMINI_MODEL = "gemini-2.5-flash"

# 한국에서 부르면 Cloudflare가 홍콩(HKG) 서버에서 돌리는데, Claude API는 홍콩에서 오는 요청을 막는다
# (403 "Request not allowed"). 그래서 Worker를 미국 동부에서 돌게 한다.
# 확인: curl -sI https://<worker>/health 의 cf-placement 머리글이 remote-... 이면 옮겨진 것
[placement]
region = "aws:us-east-1"

# 1분에 12번까지 (사람별). 따로 만들 것 없이 동작한다
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# 하루 한도: 자동 배포(scripts/ci-kv.mjs)가 KV를 만들어 아래에 연결한다. 손으로 배포할 때는 KV를 한 번 만들고 아래 주석을 푼다.
# 설치한 사람 외 가족에게 AI를 열어 주는 것은 이 하루 한도가 있을 때만 동작한다 (src/guard.ts).
#   pnpm --filter @cook/worker exec wrangler kv namespace create USAGE
# [[kv_namespaces]]
# binding = "USAGE"
# id = "여기에_출력된_id"
