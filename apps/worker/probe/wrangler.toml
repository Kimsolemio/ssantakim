# 인스타 읽기 점검용 임시 Worker (.github/workflows/instagram-probe.yml 이 잠깐 올렸다가 바로 지운다).
# 진짜 서버와 같은 곳(미국 동부)에서 인스타가 무엇을 돌려주는지 본다.
name = "family-cook-ig-probe"
main = "ig-probe.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 보관형 Observability 수집은 기본으로 끈다 (2026-12-01부터 계정 단위 종량 과금).
# 앱 요청 처리·AI 사용 한도(KV)와는 별개다. 필요할 때 wrangler tail 로 실시간 점검한다.
# 계정 전체 과금 방지는 Observability 구독/다른 데이터셋도 별도로 확인해야 한다.
[observability]
enabled = false

[observability.logs]
enabled = false

[observability.traces]
enabled = false

[observability.issues]
enabled = false

[placement]
region = "aws:us-east-1"
